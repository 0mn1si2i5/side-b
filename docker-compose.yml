services:
  api:
    build:
      context: backend/
    container_name: sideb-api
    env_file:
      - backend/.env
    environment:
      - NETEASE_API_BASE_URL=http://netease:3000
    volumes:
      - sideb-data:/app/data
    depends_on:
      netease:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8788/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - sideb-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  netease:
    image: moefurina/ncm-api:latest
    container_name: sideb-netease
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - sideb-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  nginx:
    build:
      context: nginx/
    container_name: sideb-nginx
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sideb-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  sideb-data:

networks:
  sideb-network:
    driver: bridge
